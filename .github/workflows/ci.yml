name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - run: mvn -B verify
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: JS syntax check
        run: for f in frontend/js/*.js frontend/admin/*.js frontend/sw.js; do node --check "$f"; done
      - name: Required pages exist
        run: for f in index.html chart.html dashboard.html updates.html post.html account.html pages/privacy.html pages/terms.html pages/disclaimer.html pages/risk.html pages/refund.html; do test -f "frontend/$f"; done
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npx cap add android
      - run: python3 scripts/patch-android.py example.com
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with: { name: debug-apk, path: android/app/build/outputs/apk/debug/*.apk }
