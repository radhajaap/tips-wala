<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Market Updates – Tips Wala</title><meta name="description" content="Market updates, analysis and education from Tips Wala. Information only; not SEBI registered."><link rel="stylesheet" href="css/site.css"></head>
<body><div class="w"><div class="top"><a class="logo" href="index.html">Tips<b>Wala</b></a><a href="index.html">← Home</a></div><h1>Market Updates</h1><div id="l"><p class="mut">Loading…</p></div></div>
<script src="js/config.js"></script><script src="js/common.js"></script>
<script>(async()=>{try{const l=await makeApi("tw_token")("/api/posts");$("#l").innerHTML=l.length?l.map(p=>`<a class="card" style="display:block;color:inherit" href="post.html?slug=${encodeURIComponent(p.slug)}"><span class="pill">${esc(p.category.replace(/_/g," "))}</span> ${p.premium?'<span class="pill">Premium</span>':""}<h2 style="margin:8px 0 2px">${esc(p.title)}</h2><span class="mut">${new Date(p.publishedAt).toLocaleDateString("en-IN")}</span></a>`).join(""):'<div class="card mut">Abhi koi update publish nahi hua.</div>'}catch(e){$("#l").textContent=e.message}})()</script></body></html>
