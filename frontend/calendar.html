<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Market Calendar &amp; News – Tips Wala</title><meta name="description" content="Trading holidays, RBI, inflation, GDP and global events, plus market news links with source attribution."><link rel="stylesheet" href="css/site.css"></head>
<body><div class="w"><div class="top"><a class="logo" href="index.html">Tips<b>Wala</b></a><a href="index.html">← Home</a></div><h1>Calendar &amp; News</h1>
<div class="tabs" id="t"><button class="on" data-k="c">Market Calendar</button><button data-k="n">News</button></div><div id="v"><p class="mut">Loading…</p></div>
<p class="mut" style="font-size:13px">Events aur news links manually curated hain. News ka content original source ka hai; hum sirf headline, source aur link dikhate hain. Tips Wala SEBI registered nahi hai; ye sirf information hai.</p></div>
<script src="js/config.js"></script><script src="js/common.js"></script>
<script>(()=>{const api=makeApi(null),V=$("#v"),d=s=>new Date(s).toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short",year:"numeric"});
const view={c:async()=>{const l=await api("/api/calendar");return l.length?l.map(e=>`<div class="card"><span class="pill">${esc(e.kind)}</span> <b>${esc(e.title)}</b><div class="mut">${d(e.eventDate+"T00:00:00")}${e.source?" · Source: "+esc(e.source):""}</div>${e.details?`<p>${esc(e.details)}</p>`:""}</div>`).join(""):'<div class="card mut">Abhi koi event add nahi hua.</div>'},
 n:async()=>{const l=await api("/api/news");return l.length?l.map(n=>`<div class="card"><b>${esc(n.title)}</b><div class="mut">${esc(n.source)} · ${new Date(n.publishedAt).toLocaleDateString("en-IN")}</div>${n.summary?`<p>${esc(n.summary)}</p>`:""}<a href="${esc(n.url)}" target="_blank" rel="noopener noreferrer">Original article padhein ↗</a></div>`).join(""):'<div class="card mut">Abhi koi news link add nahi hua.</div>'}};
async function show(k){V.innerHTML='<p class="mut">Loading…</p>';try{V.innerHTML=await view[k]()}catch(e){V.textContent=e.message}}
$("#t").onclick=e=>{const k=e.target.dataset.k;if(k){[...$("#t").children].forEach(b=>b.classList.toggle("on",b===e.target));show(k)}};show("c")})()</script></body></html>
